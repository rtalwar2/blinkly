<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blinkly Settings</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="settings.css">
   <script defer src="./index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
  <div class="card shadow-sm">
    <div class="card-header">
      Blinkly Settings
    </div>
    <div class="card-body">
      <form id="settings-form">
        <div class="mb-3">
          <label class="form-label">Break interval (minutes):</label>
          <input name="interval" id="interval" type="number" min="1" max="180" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Break duration (seconds):</label>
          <input name="duration" id="duration" type="number" min="5" max="600" class="form-control" required>
        </div>
<!-- 
        <div class="mb-3">
          <label class="form-label">Overlay color:</label>
          <input name="overlay_color" id="overlay_color" type="color" class="form-control form-control-color">
        </div> -->

        <!-- <div class="form-check mb-3">
          <input type="checkbox" name="sound_enabled" id="sound_enabled" class="form-check-input">
          <label class="form-check-label" for="sound_enabled">Play sound on break</label>
        </div> -->

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" name="pause_blinkly" id="pause_blinkly">
          <label class="form-check-label" for="pause_blinkly">Pause Blinkly</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">💾 Save Settings</button>
        <div class="msg" id="msg">Saved successfully!</div>
      </form>
    </div>
  </div>

 </body>
</html>
